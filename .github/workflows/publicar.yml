# Publicacion del catalogo (SPEC-etapa2 §11.2).
#
# Se dispara con un repository_dispatch desde el admin — un boton, accion de lote,
# nunca por producto — y tambien a mano desde la pestana Actions.
#
# ORDEN DISTINTO AL DEL DIAGRAMA DE §11.2, a proposito. Ese diagrama commitea
# (paso 3) ANTES del build (paso 4), y es justamente el build el que valida con Zod
# y reference(). Con ese orden, un volcado que Zod rechaza deja el JSON roto ya
# comiteado y `main` roto. El propio §11.2 dice que un build que falla no cambia
# ningun estado, y un commit malo ES un cambio de estado.
#
# Aca se valida primero y se empuja despues: si algo falla antes del push, el repo
# queda intacto y se puede volver a publicar cuando se arregle la causa.
name: Publicar catálogo

on:
  repository_dispatch:
    types: [publicar]
  workflow_dispatch:

# Cinco clicks nerviosos colapsan en un solo build (§11.2). El costo de Actions no
# lo define quien aprieta el boton, sino cuantos builds se disparan.
concurrency:
  group: publicar
  cancel-in-progress: true

permissions:
  contents: write # empujar productos.json

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # Las dos actions en su mayor mas reciente. La v4 hacia correr SU PROPIO codigo
      # sobre Node 20, que GitHub deprecio, y el aviso salia en cada corrida.
      #
      # OJO CON LA DISTINCION: eso es el runtime INTERNO de las actions, no el Node con
      # el que se construye el sitio. Ese sigue siendo el 22 de abajo, que es el mismo
      # que se usa en local (`engines: node >=22.12.0`). Subirlo aca crearia una
      # diferencia entre CI y la maquina de desarrollo, que es exactamente la clase de
      # bug que nos costo la corrida anterior.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ------------------------------------------------------------------
      # 0. Avisar que arranco
      # ------------------------------------------------------------------
      # El admin muestra "Publicando..." mientras tanto (§11.3). Con
      # `workflow_dispatch` no hay id y el script se omite solo.
      - name: Marcar la publicación como en curso
        env:
          ID_PUBLICACION: ${{ github.event.client_payload.publicacion }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/volcado/publicacion.mjs corriendo

      # ------------------------------------------------------------------
      # 1-2. Leer D1 y escribir src/data/productos.json
      # ------------------------------------------------------------------
      # Con las tres variables presentes, index.mjs usa la API HTTP de D1. Sin
      # ellas caeria al ejecutor de wrangler, que aca no tiene sesion: por eso
      # los tres secrets son obligatorios y no opcionales.
      - name: Volcar D1 a productos.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run volcar

      # ------------------------------------------------------------------
      # 3. Validar ANTES de empujar
      # ------------------------------------------------------------------
      - name: Tests
        run: npm test

      # El build es donde Zod y reference() validan el JSON recien volcado
      # (§11.2). Si el volcado emitio algo invalido, se cae ACA, con el repo
      # todavia intacto.
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXABLE: ${{ vars.INDEXABLE }}
          PUBLIC_R2_BASE: ${{ vars.PUBLIC_R2_BASE }}
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP }}
        run: npm run build

      # ------------------------------------------------------------------
      # 4. Recien ahora, commit y push si hubo cambios
      # ------------------------------------------------------------------
      # `git diff --quiet` decide: sin cambios no se commitea, asi que una
      # publicacion sin novedades no genera un commit vacio (SPEC.md §6.5).
      - name: Commitear productos.json si cambio
        run: |
          if git diff --quiet -- src/data/productos.json; then
            echo "productos.json sin cambios: no se commitea."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/productos.json
          git commit -m "chore(catalogo): publicar cambios del catalogo"
          # Destino explicito: no se asume que el checkout haya dejado una rama
          # con seguimiento. Esto no se puede probar sin correr la Action, asi que
          # se elige la forma que no depende de ese detalle.
          git push origin HEAD:${{ github.ref_name }}

      # ------------------------------------------------------------------
      # 5. Desplegar
      # ------------------------------------------------------------------
      - name: Desplegar el sitio publico
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      # ------------------------------------------------------------------
      # 6. Sellar: aprobado -> publicado y publicado_en (§5.2)
      # ------------------------------------------------------------------
      # Va DESPUES del deploy y sin `if: always()`: si el deploy fallo, nada de
      # esto ocurrio y marcar productos como publicados seria mentir. Es la
      # promesa de §11.2 — «nunca queda un publicado que en realidad no esta en
      # el sitio» — y el orden de los pasos es lo que la sostiene.
      #
      # Sella contra src/data/productos.json, o sea contra el archivo que se
      # acaba de desplegar, y no contra "todos los aprobados de ahora": entre el
      # volcado y este paso pasaron minutos, y un producto aprobado en el medio
      # NO esta en el sitio todavia.
      - name: Sellar la publicación
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/volcado/sellar.mjs

      # ------------------------------------------------------------------
      # 7. Reportar el resultado
      # ------------------------------------------------------------------
      # NO es un POST al admin como dice el diagrama de §11.2: la Action no puede
      # pasar Cloudflare Access, y un endpoint de vuelta exigiria un service token
      # o excluir una ruta de la politica — superficie de autenticacion nueva en la
      # pieza mas protegida. La Action ya tiene credenciales de D1, asi que escribe
      # la fila directo y el admin la lee. Mismo efecto de §11.3, sin puerta nueva.
      #
      # `if: always()` es lo que hace visible la FALLA, que es el punto entero de
      # §11.3: sin eso, un build roto deja la publicacion en "Publicando..." para
      # siempre y quien opera no se entera nunca.
      - name: Reportar el resultado
        if: always()
        env:
          ID_PUBLICACION: ${{ github.event.client_payload.publicacion }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            PRODUCTOS=$(node -e "console.log(require('./src/data/productos.json').length)")
            node scripts/volcado/publicacion.mjs ok \
              --productos "$PRODUCTOS" \
              --commit "$(git rev-parse HEAD)" \
              --run "$RUN_URL"
          else
            node scripts/volcado/publicacion.mjs error \
              --mensaje "El build falló. Ver el detalle técnico en el run." \
              --run "$RUN_URL"
          fi

